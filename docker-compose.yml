services:

  # ─────────────────────────────────────────
  # BASE DE DATOS
  # ─────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: alia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/Front_ALIA
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE}
    container_name: alia-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-gateway

  # ─────────────────────────────────────────
  # API GATEWAY
  # ─────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: alia-api-gateway
    restart: unless-stopped
    ports:
      - "${PORT_API_GATEWAY}:${PORT_API_GATEWAY}"
    env_file: ./backend/.env
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
      svc-auth:
        condition: service_started
      svc-usuarios:
        condition: service_started
      svc-documentos:
        condition: service_started
      svc-ingesta:
        condition: service_started
      svc-busqueda:
        condition: service_started
      svc-generacion:
        condition: service_started

  # ─────────────────────────────────────────
  # SERVICIOS BACKEND
  # ─────────────────────────────────────────
  svc-auth:
    build:
      context: ./backend
      dockerfile: svc-auth/Dockerfile
    container_name: alia-svc-auth
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy

  svc-usuarios:
    build:
      context: ./backend
      dockerfile: svc-usuarios/Dockerfile
    container_name: alia-svc-usuarios
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy

  svc-documentos:
    build:
      context: ./backend
      dockerfile: svc-documentos/Dockerfile
    container_name: alia-svc-documentos
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: mysql
      STORAGE_DIR: /app/storage
    volumes:
      - storage_data:/app/storage
      - documentos_tmp:/app/tmp
    depends_on:
      mysql:
        condition: service_healthy

  svc-ingesta:
    build:
      context: ./backend
      dockerfile: svc-ingesta/Dockerfile
    container_name: alia-svc-ingesta
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: mysql
      STORAGE_DIR: /app/storage
    volumes:
      - storage_data:/app/storage
    depends_on:
      mysql:
        condition: service_healthy

  svc-busqueda:
    build:
      context: ./backend
      dockerfile: svc-busqueda/Dockerfile
    container_name: alia-svc-busqueda
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy

  svc-generacion:
    build:
      context: ./backend
      dockerfile: svc-generacion/Dockerfile
    container_name: alia-svc-generacion
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: mysql
      STORAGE_DIR: /app/storage
    volumes:
      - storage_data:/app/storage
    depends_on:
      mysql:
        condition: service_healthy

# ─────────────────────────────────────────
# VOLÚMENES
# ─────────────────────────────────────────
volumes:
  mysql_data:
  storage_data:
  documentos_tmp: